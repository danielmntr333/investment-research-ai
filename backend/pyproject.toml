[tool.poetry]
name = "investment-research-ai"
version = "1.0.0"
description = "AI-powered financial document analysis platform"
authors = ["Your Name <your.email@example.com>"]
readme = "../README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
# Core
fastapi = "^0.128.0"
uvicorn = {extras = ["standard"], version = "^0.40.0"}
python-multipart = "^0.0.20"
pydantic = "^2.12.5"
pydantic-settings = "^2.7.1"

# Database
supabase = "^2.11.0"
asyncpg = "^0.30.0"

# LLM Providers
openai = "^1.59.0"
anthropic = "^0.44.0"
litellm = "^1.56.0"
cohere = "^5.13.0"

# LangChain/LangGraph (major 1.0 release!)
langchain = "^0.3.15"
langgraph = "^0.2.62"
langchain-community = "^0.3.15"
langchain-openai = "^0.3.2"

# Web Search
tavily-python = "^0.5.0"

# Observability
langsmith = "^0.2.10"
structlog = "^25.1.0"

# Document Processing
pymupdf = "^1.25.3"
pdfplumber = "^0.11.6"
python-docx = "^1.1.2"
openpyxl = "^3.1.5"
pandas = "^2.2.3"
beautifulsoup4 = "^4.12.3"
matplotlib = "^3.9.0"

# Evaluation
ragas = "^0.2.8"
datasets = "^3.2.0"
spacy = "^3.7.0"

# Utils
httpx = "^0.28.1"
tenacity = "^9.1.2"
python-dotenv = "^1.0.1"

[tool.poetry.group.test.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.2"
pytest-cov = "^6.0.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.9.3"
black = "^25.1.0"
mypy = "^1.14.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
